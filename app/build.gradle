plugins {
    id 'com.android.application'
}

android {
    namespace 'ctrl.mietze.veyrapacketlab'
    compileSdk 35

    defaultConfig {
        applicationId 'ctrl.mietze.veyrapacketlab'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '0.11.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
