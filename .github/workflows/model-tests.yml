name: PacketLab Virtual Model CI

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/js/**'
      - 'tests_packetlab*.js'
      - '.github/workflows/model-tests.yml'
  pull_request:
    paths:
      - 'app/src/main/assets/js/**'
      - 'tests_packetlab*.js'
      - '.github/workflows/model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-model:
    name: Validate graph and packet semantics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/js/packetlab-v06.js
          node --check app/src/main/assets/js/packetlab-v06-engine.js
          node --check app/src/main/assets/js/packetlab-next.js
          node --check app/src/main/assets/js/packetlab-core.js
      - name: Test original model
        run: node tests_packetlab_core.js
      - name: Test v0.6 security and flow model
        run: node tests_packetlab_v06.js
