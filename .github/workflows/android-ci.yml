name: PacketLab Android CI
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure SDK and Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain :app:assembleDebug
      - name: Upload unsigned-for-production debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PacketLab-Android-CI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
