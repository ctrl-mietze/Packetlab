name: Feature request
description: Suggest a bounded virtual networking feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What workflow or learning goal does this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed interaction and expected simulated result
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: How should we verify it?
      description: Include example topology, source/destination and expected event log.
