<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon: ek chhota star network. Wahi cheez jo app karti hai —
       beech me switch, uske chaaron taraf devices, aur unhe jodte cable.
       Poora vector hai, isliye kisi bhi naap par saaf dikhta hai aur
       project me koi binary file nahi aati. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a47"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- cable -->
  <g stroke="#22d3ee" stroke-width="11" stroke-linecap="round" opacity="0.75">
    <path d="M256 256 L256 136"/>
    <path d="M256 256 L360 196"/>
    <path d="M256 256 L360 316"/>
    <path d="M256 256 L256 376"/>
    <path d="M256 256 L152 316"/>
    <path d="M256 256 L152 196"/>
  </g>

  <!-- baahar ke devices -->
  <g fill="#93a3c0">
    <circle cx="256" cy="136" r="30"/>
    <circle cx="360" cy="196" r="30"/>
    <circle cx="360" cy="316" r="30"/>
    <circle cx="256" cy="376" r="30"/>
    <circle cx="152" cy="316" r="30"/>
    <circle cx="152" cy="196" r="30"/>
  </g>

  <!-- beech ka switch -->
  <circle cx="256" cy="256" r="52" fill="url(#hub)"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#a5b4fc" stroke-width="6"/>
</svg>
